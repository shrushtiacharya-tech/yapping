<!DOCTYPE html>
<html>
<head>
  <title>Contact Yapping 💬</title>
  <meta name="description" content="Contact Yapping team for feedback, support, or inquiries about anonymous chatting.">
  <meta name="keywords" content="Yapping, contact, feedback, support, inquiries, chat support, anonymous chat help">
  <style>
    body { margin:0; background:black; color:white; font-family:Arial,sans-serif; display:flex; flex-direction:column; align-items:center; padding:20px; overflow-x:hidden; }
    header { color:#32A9E0; font-size:36px; margin-bottom:10px; text-align:center; position:relative; z-index:10; }
    nav { text-align:center; margin-bottom:20px; position:relative; z-index:10; }
    nav a { color:#F77F82; text-decoration:none; margin:0 10px; font-size:16px; }
    nav a:hover { text-decoration:underline; }
    .content { max-width:600px; width:90%; background:#111; padding:20px; border-radius:10px; margin-bottom:30px; position:relative; z-index:10; }
    .content h2 { color:#32A9E0; margin-bottom:10px; }
    .content p, .content label, .content input, .content textarea { color:#ccc; line-height:1.6; margin-bottom:10px; display:block; width:100%; }
    .content input, .content textarea { background:#222; border:none; padding:10px; border-radius:10px; color:white; resize:none; }
    .content button { background:#F77F82; color:black; border:none; padding:10px 20px; border-radius:20px; cursor:pointer; margin-top:10px; }
    .content button:hover { transform:scale(1.1); box-shadow:0 0 10px #F77F82,0 0 20px #32A9E0; }
    footer { text-align:center; margin-top:20px; font-size:12px; color:#aaa; position:relative; z-index:10; }
    footer a { color:#F77F82; text-decoration:none; margin:0 5px; }
    .floating-emojis { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:0; }
    .floating-emojis span { position:absolute; font-size:24px; opacity:0.8; animation:float 12s linear infinite; }
    @keyframes float {0%{transform:translateY(100vh) translateX(0) rotate(0deg); opacity:0.6}50%{opacity:1}100%{transform:translateY(-10vh) translateX(50px) rotate(360deg); opacity:0.6}}
  </style>
</head>
<body>

<header>Contact Yapping 💬</header>

<nav>
  <a href="index.html">Home</a>
  <a href="blog.html">Blog</a>
  <a href="about.html">About</a>
  <a href="terms.html">Terms</a>
  <a href="privacy.html">Privacy</a>
  <a href="contact.html">Contact</a>
</nav>

<div class="content">
  <h2>Send Us a Message</h2>
  <form onsubmit="sendFeedback(event)">
    <label for="name">Name (Optional)</label>
    <input type="text" id="name" placeholder="Your name">
    <label for="email">Email (Optional)</label>
    <input type="email" id="email" placeholder="Your email">
    <label for="message">Message</label>
    <textarea id="message" rows="5" placeholder="Your message..." required></textarea>
    <button type="submit">Send 💌</button>
  </form>
  <p id="response"></p>
</div>

<footer>
  <a href="about.html">About</a> |
  <a href="terms.html">Terms</a> |
  <a href="privacy.html">Privacy</a>
</footer>

<div class="floating-emojis">
  <span style="left:5%; animation-duration:12s;">💖</span>
  <span style="left:20%; animation-duration:15s;">🌸</span>
  <span style="left:40%; animation-duration:10s;">✨</span>
  <span style="left:60%; animation-duration:18s;">😂</span>
  <span style="left:80%; animation-duration:14s;">💬</span>
</div>

<script>
// Sparkle cursor
document.addEventListener("mousemove", e=>{
  let sparkle=document.createElement("div");
  sparkle.innerText="✨";
  sparkle.style.position="absolute";
  sparkle.style.left=e.pageX+"px";
  sparkle.style.top=e.pageY+"px";
  sparkle.style.fontSize="16px";
  sparkle.style.pointerEvents="none";
  sparkle.style.zIndex="9999";
  document.body.appendChild(sparkle);
  setTimeout(()=>{ sparkle.remove(); },800);
});

// Simple feedback form (fake submission)
function sendFeedback(e){
  e.preventDefault();
  document.getElementById("response").innerText="💖 Thank you! Your message has been sent!";
  document.getElementById("message").value="";
  document.getElementById("name").value="";
  document.getElementById("email").value="";
}
</script>

</body>
</html>
