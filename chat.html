<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yapping 💬 | Chat</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{
  margin:0;
  background:#000;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* CHAT CONTAINER */
.chat-container{
  width:90%;
  max-width:600px;
  height:90vh;
  border:1px solid #333;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  background:#0b0b0b;
}

/* HEADER */
.chat-header{
  padding:12px;
  background:#111;
  text-align:center;
  font-weight:bold;
  color:#32A9E0;
}

/* ONLINE COUNT */
#strangerCount{
  text-align:center;
  font-size:13px;
  color:#32A9E0;
  margin:6px 0;
}

/* MESSAGES */
#messages{
  flex:1;
  padding:12px;
  overflow-y:auto;
}

/* MESSAGE BUBBLES */
.msg{
  max-width:75%;
  padding:8px 12px;
  margin:6px 0;
  border-radius:18px;
  font-size:14px;
  word-wrap:break-word;
}
.you{
  background:#32A9E0;
  color:#000;
  margin-left:auto;
  border-bottom-right-radius:4px;
}
.stranger{
  background:#F77F82;
  color:#000;
  margin-right:auto;
  border-bottom-left-radius:4px;
}
.system{
  background:#333;
  color:#ccc;
  margin:6px auto;
  font-size:12px;
  border-radius:10px;
  text-align:center;
}

/* TYPING */
#typing{
  font-size:12px;
  color:#aaa;
  padding-left:12px;
  height:16px;
}

/* CONTROLS */
.controls{
  display:flex;
  gap:6px;
  padding:8px;
  background:#111;
  align-items:center;
}

#messageInput{
  flex:1;
  padding:8px;
  border-radius:20px;
  border:none;
  outline:none;
}

/* BUTTONS */
button{
  background:#F77F82;
  border:none;
  padding:8px 12px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}

button.secondary{
  background:#222;
  color:#fff;
}

/* EMOJI PICKER */
#emojiBox{
  position:absolute;
  bottom:100px;
  background:#111;
  border:1px solid #333;
  border-radius:10px;
  padding:6px;
  display:none;
}
#emojiBox span{
  cursor:pointer;
  font-size:20px;
  margin:4px;
}
</style>
</head>

<body>

<div class="chat-container">

  <div class="chat-header">Yapping 💬 — Stranger Chat</div>
  <div id="strangerCount">👥 0 strangers online now</div>

  <div id="messages"></div>
  <div id="typing"></div>

  <div class="controls">
    <button class="secondary" onclick="goHome()">⬅ Back</button>
    <button onclick="toggleEmoji()">😀</button>
    <input id="messageInput" placeholder="Type here..." autocomplete="off">
    <button onclick="sendMessage()">Send</button>
  </div>

  <div class="controls">
    <button class="secondary" onclick="nextChat()">Next</button>
    <button class="secondary" onclick="blockUser()">Block</button>
    <button class="secondary" onclick="reportUser()">Report</button>
  </div>

</div>

<!-- EMOJI BOX -->
<div id="emojiBox">
  <span onclick="addEmoji('😀')">😀</span>
  <span onclick="addEmoji('😂')">😂</span>
  <span onclick="addEmoji('😍')">😍</span>
  <span onclick="addEmoji('😭')">😭</span>
  <span onclick="addEmoji('😡')">😡</span>
  <span onclick="addEmoji('🔥')">🔥</span>
  <span onclick="addEmoji('💀')">💀</span>
</div>

<script>
const socket = io();
const messages = document.getElementById("messages");
const input = document.getElementById("messageInput");
const typing = document.getElementById("typing");
const emojiBox = document.getElementById("emojiBox");

let typingTimeout;

/* SYSTEM MESSAGE */
function addSystem(text){
  const div=document.createElement("div");
  div.className="msg system";
  div.innerText=text;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

/* NORMAL MESSAGE */
function addMsg(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

/* START */
addSystem("🔍 Finding a stranger...");
socket.emit("start");

/* SOCKET EVENTS */
socket.on("matched",()=>{
  addSystem("✅ Connected with a stranger. Say hi 👋");
});

socket.on("message",msg=>addMsg(msg,"stranger"));

socket.on("ended",()=>{
  addSystem("❌ Stranger disconnected.");
});

socket.on("typing",()=>{
  typing.innerText="💬 Stranger is typing...";
  clearTimeout(typingTimeout);
  typingTimeout=setTimeout(()=>typing.innerText="",1000);
});

/* SEND */
function sendMessage(){
  const msg=input.value.trim();
  if(!msg) return;
  socket.emit("message",msg);
  addMsg(msg,"you");
  input.value="";
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter") sendMessage();
  socket.emit("typing");
});

/* CONTROLS */
function nextChat(){
  messages.innerHTML="";
  addSystem("🔍 Finding a new stranger...");
  socket.emit("next");
}

function blockUser(){
  socket.emit("block");
  messages.innerHTML="";
  addSystem("🚫 User blocked");
}

function reportUser(){
  socket.emit("report");
  addSystem("⚠ User reported");
}

function goHome(){
  socket.emit("next");
  window.location.href="/";
}

/* EMOJI */
function toggleEmoji(){
  emojiBox.style.display =
    emojiBox.style.display==="block"?"none":"block";
}
function addEmoji(e){
  input.value+=e;
}

/* FAKE ONLINE COUNT */
function updateStrangerCount(){
  const base=1800;
  const random=Math.floor(Math.random()*400);
  document.getElementById("strangerCount").innerText=
    `👥 ${base+random} strangers online now`;
}
updateStrangerCount();
setInterval(updateStrangerCount,5000);
</script>

</body>
</html>
